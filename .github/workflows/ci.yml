name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint (ESLint + eslint-plugin-playwright)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Unit tests (report parser, trace and listing helpers, path guard)
        run: npm test
      - name: Job summary
        if: ${{ !cancelled() }}
        run: node dist/summary.js test-results/results.json --title "Unit tests"
      - name: Smoke test over stdio (list, run, explain, rerun by ID)
        run: npm run smoke
      - name: Package contents
        run: npm pack --dry-run
